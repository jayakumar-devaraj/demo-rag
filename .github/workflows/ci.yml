name: ci

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rag
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://rag@localhost:5434/rag
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - run: uv sync --locked
      - run: uv run pytest -q -p no:warnings --cov=src --cov-report=term-missing
      - name: Build the migrate image
        run: docker build --target migrate -t migrate-check .
      - name: Run the migrate image against a scratch database
        run: |
          docker exec $(docker ps -qf ancestor=pgvector/pgvector:pg16) psql -U rag -d rag -c "CREATE DATABASE migrate_check"
          docker run --rm --network host -e MIGRATION_DATABASE_URL=postgresql://rag@localhost:5434/migrate_check migrate-check

  docs:
    # Documents must not point at anything that does not exist, and every diagram must render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Links and orchestration references
        run: python3 scripts/check_docs.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mermaid diagrams render
        run: |
          npm install --no-save --silent @mermaid-js/mermaid-cli@12.0.0
          for f in $(git ls-files '*.md' | xargs grep -l '^```mermaid'); do
            echo "rendering $f"
            npx mmdc -p .github/mermaid-puppeteer.json -i "$f" -o "$RUNNER_TEMP/out.md" -q
          done
