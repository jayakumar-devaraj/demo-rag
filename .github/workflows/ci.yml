name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rag
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://rag@localhost:5434/rag
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - run: uv sync --locked
      - run: uv run pytest -q -p no:warnings
