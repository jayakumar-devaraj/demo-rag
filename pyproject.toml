[project]
name = "demo-rag"
version = "0.1.0"
description = "Polymorphic, multi-tenant agentic RAG over PDF/XLSX/DOCX/TXT"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.141.1",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "langfuse==4.15.6",
    "langgraph==1.2.12",
    "openpyxl==3.1.5",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "ragas==0.4.3",
    "uvicorn==0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the real Postgres+pgvector from docker-compose.yml (DATABASE_URL)"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
